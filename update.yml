name: Update stock radar

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"    # NSE hours (IST 08:30-16:30)
    - cron: "*/15 13-21 * * 1-5"   # US hours
  workflow_dispatch:                # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show repository files
        run: ls -la
      - name: Install Python packages
        run: pip install yfinance pandas requests
      - name: Fetch prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE=auto; else MODE=all; fi
          python fetch_radar_data.py $MODE
      - name: Build site
        run: |
          mkdir -p site/data
          cp index.html site/
          cp -r data/. site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
